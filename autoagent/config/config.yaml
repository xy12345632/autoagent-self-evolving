opencode_zen_api_key: YOUR_OPENCOD_EZEN_API_KEY
openrouter_api_key: YOUR_OPENROUTER_API_KEY

model_providers:
  opencode_zen:
    endpoint: https://opencode.ai/zen/v1
    default_model: minimax-m2.5-free
  openrouter:
    endpoint: https://openrouter.ai/api/v1
    default_model: openai/gpt-4o-mini

memory:
  type: sqlite_fts
  db_path: ./data/memory.db

skills:
  path: ./skills
  auto_create: true

gateway:
  cli:
    enabled: true
  telegram:
    enabled: false
    bot_token: ""
  discord:
    enabled: false
    bot_token: ""
  slack:
    enabled: false
    bot_token: ""
  whatsapp:
    enabled: false

tools:
  web_search:
    enabled: true
    provider: duckduckgo
  terminal:
    enabled: true
    allowed_commands:
      - ls
      - cd
      - pwd
      - git
      - npm
      - python
      - node
  code_execute:
    enabled: true
    sandbox: docker
