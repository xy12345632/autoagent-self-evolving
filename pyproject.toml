[project]
name = "autoagent"
version = "0.1.0"
description = "自进化个人AI Agent"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "telethon>=1.35.0",
    "discord.py>=2.3.0",
    "slack-sdk>=3.21.0",
    "httpx>=0.25.0",
    "rich>=13.7.0",
    "click>=8.1.0",
    "apscheduler>=3.10.0",
    "Pillow>=10.0.0",
    "openai>=1.12.0",
]

[project.scripts]
autoagent = "autoagent.main:main_sync"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["autoagent*"]

[tool.setuptools.package-data]
autoagent = ["data/*", "config/*"]
